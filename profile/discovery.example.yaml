schema_version: 2
# Lanes run at the same time, each against this budget, in hours.
deadline_hours: 4
# The view accepts your own country and every other country row in
# application_answers.yaml work_authorization.countries. To narrow it, set
# location_allowlist: {countries: [...]}.
# Where the linkedin/indeed lanes search, as against what the view accepts. Absent = the allowlist's countries, capped at 5:
# each location multiplies the query count. The board lanes are unaffected.
# search_locations: ["Germany", "Netherlands", "United Kingdom"]
# Optional: search these lanes' abroad_terms (lane.yaml; absent: its
# search_terms) in every other country the answer bank lists, on these jobspy sources. Abroad, the view
# keeps only these lanes.
# abroad: {lanes: [example_primary], sources: [linkedin, indeed]}
# The live view (clean.parquet): a job stays while seen within live_days.
# Optional: search_max_age_days: N also drops a LinkedIn/Indeed row posted
# more than N days ago. Absent = no posted-age cut.
live_days: 14
# How long a job stays in the view from first seen: high_days at fit >=
# the lowest lane `score.cutoff` (or unscored), else low_days.
retention: {high_days: 60, low_days: 15}
# Optional: retention_from: newest counts that from the job's newest posting
# that passes the view, so a repost restarts it. Absent = first.
# Untracked postings not seen for this long leave the store.
forget_after_days: 120
# Nightly debug shards under jobs/raw/.
raw_keep_days: 3
# Nightly logs under logs/ (discovery_*.log).
log_keep_days: 30
# A board that 404s three checks in a row is re-checked this often.
dead_every_days: 14
# Every source the loader accepts. every_days: days between checks of one
# board. page_delay_* pace the pages of one jobspy query; pacing_seconds paces
# queries, boards and feed page fetches. hours_old / results_wanted: the jobspy
# search window and the results per query (default 100; LinkedIn at most 140).
# remote_queries: false drops the remote copy of each query.
sources:
  linkedin:      {enabled: true,  pacing_seconds: 3, page_delay_seconds: 3, page_delay_band_seconds: 4}
  # Optional, LinkedIn only: search within companies whose careers site no lane
  # reads. Add under linkedin as companies: {terms: [widget], ids: {Acme Widgets: 123}}
  indeed:        {enabled: true,  pacing_seconds: 2}
  greenhouse:    {enabled: true,  pacing_seconds: 1, every_days: 1}
  lever:         {enabled: true,  pacing_seconds: 1, every_days: 1}
  ashby:         {enabled: true,  pacing_seconds: 2, every_days: 1}
  # Workday is the slowest lane per kept row and manual-apply only, so a
  # third of it a night is a good start. Workday and Eightfold search each
  # tenant with each lane's first terms_per_lane search terms (default 3).
  workday:       {enabled: true,  pacing_seconds: 2, every_days: 3}
  # Ten postings a page.
  eightfold:     {enabled: true,  pacing_seconds: 1, every_days: 3, max_pages: 6}
  # The stapply.ai daily file of public ATS jobs (one download a night).
  # A snapshot older than max_snapshot_age_hours is skipped.
  stapply:       {enabled: true,  max_snapshot_age_hours: 36}

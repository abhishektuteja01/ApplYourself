schema_version: 1
# Sources run concurrently, so this caps each lane independently rather than
# being shared across them.
deadline_hours: 4
location_allowlist:
  countries: ["United States"]
  # states: ["Texas", "NY"]   # optional narrowing; full name or code, either works
  # cities: ["Austin"]        # optional narrowing; empty/absent = all cities
  # continents: ["Europe"]    # optional shorthand: expands to every country on
  #                           # the continent, unioned with `countries` above
# Where the linkedin/indeed lanes search, as against the allowlist above, which
# is what cleaning accepts. Absent = the allowlist's countries. Capped at 5
# locations when absent: each one multiplies the query count and the pacing
# sleep. Set it to query fewer places than you accept.
# search_locations: ["Germany", "Netherlands", "United Kingdom"]
# Every source the loader accepts. An omitted key falls back to the code default
# in src/discovery/config.py, so list them all to stay explicit.
# `cadence` is optional and defaults to daily. One of: daily, weekdays, weekly
# (Monday), every_n_days:N. A skipped night writes no shard and reports as
# SKIPPED, which the digest excludes from its medians and alarms.
sources:
  linkedin:      {enabled: true,  pacing_seconds: 3}
  indeed:        {enabled: true,  pacing_seconds: 2}
  greenhouse:    {enabled: true,  pacing_seconds: 1}
  lever:         {enabled: true,  pacing_seconds: 1}
  ashby:         {enabled: true,  pacing_seconds: 2}
  workday:       {enabled: true,  pacing_seconds: 2}
raw_retention_days: 16
# Ceiling on the career-board staleness exemption, in days. 0 = off: a posting
# still listed on the company's own board is live regardless of age.
board_max_age_days: 0

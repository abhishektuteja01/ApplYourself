# TEMPLATE — copy to profile/resume.yaml and replace with your own.
#
# The one home for the fixed parts of every resume: your name, contact line,
# education, and one `contexts:` entry per job or project. /tailor and /score
# build every lane's resume from this file, profile/bullets.md and
# profile/skills_master.md; nothing retypes these lines.
#
# contexts: keyed by the bullet prefix — B-WID-01 belongs to WID.
#   section:   work | projects
#   title, dates (all), org + location (work), subtitle (projects, optional)
#   lanes:     {lane: {min, max, order}} — the bullets this context gets on
#              that lane's resume, and its place among the lane's contexts
#              (optional; lower first, ties keep file order). A lane not
#              listed never shows the context.


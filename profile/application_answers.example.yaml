# TEMPLATE — copy to profile/application_answers.yaml and replace every value.
#
# The answer bank: everything /apply puts on an application form. Read by
# src/apply/answers.py. DO NOT COMMIT YOUR COPY (profile/* is gitignored).
#
# You write `identity` through `work_authorization` — facts only you can state.
# `claims`, `fact_wordings` and `questions` grow on their own: every /apply run
# you confirm saves what it learned here (a new wording, a board's option
# spelling, a new answer), so the same question is never asked twice. Review or undo with
# `uv run apply learn` and `uv run apply learn --undo <id>`.

schema_version: 2

# Which browser drives the form. patchright | playwright.
browser:
  driver: patchright
  stealth: true

identity:
  first_name: "Alex"
  last_name: "Example"
  preferred_name: "Alex"
  email: "alex@example.com"
  phone: "+1 555 0100"
  location: "Exampletown, Example State, United States"
  # Optional: the same place as other boards spell it. Exact matches only.
  # location_alternates: ["Exampletown, ES, USA"]
  country: "United States"

education:
  school: "Example University"
  # Optional: the same school as other boards spell it. Exact matches only.
  # school_alternates: ["Example University - Exampletown, ES"]
  degree: "Master's Degree"
  discipline: "Widget Engineering"
  start_year: 2019
  end_year: 2021
  start_month: "September"
  end_month: "May"

# Optional. only_when_required: fill it only where a board requires it.
employment:
  only_when_required: true
  company_name: "Widget Corp"
  title: "Widget Operations Analyst"
  start_month: "January"
  start_year: 2023
  end_month: "June"
  end_year: 2025
  current_role: false

# Optional. Your answer per EEOC topic, every spelling boards use, best first.
# A topic you leave out, or a board offering none of your spellings, gets the
# board's "decline to answer". Topics: gender, race, hispanic_ethnicity,
# veteran_status, disability_status. Anything else (orientation, pronouns) declines.
# demographics:
#   answers:
#     gender: ["Male", "Man"]
#     hispanic_ethnicity: ["No", "Not Hispanic or Latino"]

# when_required: attach a cover letter only where the board requires one.
# when_offered: wherever the board has a cover-letter upload (/apply writes one).
cover_letter: when_required

# Legal facts, per country. A question names a country, or means the job's.
# Every country you do not list answers from `default`.
#   authorized            may you work there today
#   requires_sponsorship  now or at any point later
#   unrestricted          authorized with no sponsorship ever (citizen, permanent resident)
#   status_label          answers "what is your work status" in a text box
#   followup              answers "please explain your visa situation"
#   start_in_days         your start date is this many days after the form is filled
#   visa_salary_floor     optional: the lowest gross salary that country's work visa
#                         allows, {amount, currency (ISO code), per: year | month, note}
#   salary                optional: what a salary question asks for there, {amount,
#                         currency, markup_pct, lanes}. markup_pct (your own country
#                         only): a posting's minimum in `currency` times it, ahead of
#                         amount. lanes: the lanes it answers for (absent: every lane).
# us_person: park | yes | no — the export-control "U.S. person" question. Quote it.
work_authorization:
  us_person: "park"
  nationalities: ["Exampleland"]
  countries:
    default: {authorized: false, requires_sponsorship: true}
    United States:
      authorized: true
      requires_sponsorship: true
      status_label: "F-1 STEM OPT"
      followup: "Authorized under F-1 STEM OPT; will need sponsorship when it ends."
      start_in_days: 14
      # salary: {amount: 110000, currency: USD, markup_pct: 10}
    # Germany:
    #   authorized: false
    #   requires_sponsorship: true
    #   visa_salary_floor: {amount: 48300, currency: EUR, per: year, note: "EU Blue Card"}

# A board's full-sentence work-authorization option -> the facts it states. An
# option is picked only when every fact it states is true for that country.
claims:
  "I am authorized to work in the United States and will require sponsorship in the future":
    {authorized: true, requires_sponsorship: true, country: United States}

# A yes/no work-authorization or export-control label -> the fact that answers
# it. The answer is "Yes" when the fact equals yes_when. Exact wording only.
# Facts: us_person, authorized, requires_sponsorship, unrestricted.
# fact_wordings:
#   "Are you legally able to work here without a visa?":
#     {fact: unrestricted, yes_when: true}

# Every other question. `wordings` are whole labels (exact); `keywords` are
# substrings, a guess the session confirms before it counts. `not` lists labels
# a keyword must never answer. An answer is text, a list of spellings (the first
# the board offers wins), or {fact: identity.first_name}, {computed: salary |
# start_date | how_heard}, {role_file: why_company} (this role's
# company_answers.yaml).
questions:
  linkedin:
    answer: "https://linkedin.com/in/example"
    keywords: [linkedin]
  website:
    answer: "https://example.com"
    keywords: [website, portfolio, personal site]
  salary:
    # The `salary` on the role's country row (work_authorization). "Yes" answers
    # a Yes/No "is the posted range acceptable?".
    answer: {computed: salary, fallback: ["Yes"]}
    keywords: [salary, compensation, desired rate of pay, pay expectation]
  start_date:
    answer: {computed: start_date}
    keywords: [start date, when can you start, earliest]
  how_did_you_hear:
    answer: {computed: how_heard, fallback: ["Careers Page", "Company Website", "Other"]}
    keywords: [how did you hear, where did you hear, how did you learn]
    mode: contains
  pronouns:
    answer: ["They/Them"]
    keywords: [pronouns]
  languages_fluent:
    # The languages you speak. /score also reads it: a JD requiring another is skipped.
    answer: ["English"]
    keywords: [languages in which you are fluent]
  legal_first_name:
    answer: {fact: identity.first_name}
    keywords: [legal first name]
  current_company:
    answer: {fact: employment.company_name}
    wordings: [current company, current employer]
    only_when_required: true
  why_company:
    answer: {role_file: why_company}
    keywords: [why do you want to work, why are you interested in joining]
  why_role:
    answer: {role_file: why_role}
    keywords: [why this role, why are you interested in this role]
  what_interests_you_about_product:
    answer: {role_file: what_interests_you_about_product}
    keywords: [what excites you about, what interests you about]

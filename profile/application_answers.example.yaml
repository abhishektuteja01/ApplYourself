# TEMPLATE — copy to profile/application_answers.yaml and replace every value.
#
# The answer bank: everything /apply puts on an application form. Read by
# src/applyourself/apply/. DO NOT COMMIT YOUR COPY (profile/* is gitignored).
#
# You write `identity` through `facts` — things only you can state (what
# resume.yaml already says is read from it). The apply-judge answers each
# form field from `facts` and `questions`, and asks you when they don't cover it.
# Your answer to an ask becomes a new fact, and an approved new written answer
# becomes a new question, so the same thing is never asked twice. Review or undo
# with `uv run apply learn` and `uv run apply learn --undo <id>`.

schema_version: 4

# identity, education and employment read profile/resume.yaml for every key
# left out here: first/last/preferred name from `name`, email and phone from the
# mailto:/tel: contact links, location from the first plain contact line;
# school (detail up to the first comma), degree, discipline (after " in ") and
# dates from education[0]; company, title and dates from the work context that
# ended last. Set a key here only where a form needs other wording.
identity:
  phone: "+1 555 0100"
  location: "Exampletown, Example State, United States"
  # Optional: the same place as other boards spell it. Exact matches only.
  # location_alternates: ["Exampletown, ES, USA"]
  country: "United States"

education:
  # Optional: the same school as other boards spell it. Exact matches only.
  # school_alternates: ["Example University - Exampletown, ES"]
  degree: "Master's Degree"
  discipline: "Widget Engineering"
  end_year: 2021
  end_month: "May"

# Optional. only_when_required: fill it only where a board requires it.
employment:
  only_when_required: true

# Optional. Your answer per EEOC topic, every spelling boards use, best first.
# A topic you leave out, or a board offering none of your spellings, gets the
# board's "decline to answer". Topics: gender, race, hispanic_ethnicity,
# veteran_status, disability_status. Anything else (orientation, pronouns) declines.
# demographics:
#   answers:
#     gender: ["Male", "Man"]
#     hispanic_ethnicity: ["No", "Not Hispanic or Latino"]
#     sexual_orientation: ["Heterosexual", "Straight"]

# when_required: attach a cover letter only where the board requires one.
# when_offered: wherever the board has a cover-letter upload (/apply writes one).
cover_letter: when_required

# Legal facts, per country. A question names a country, or means the job's.
# Every country you do not list answers from `default`.
#   authorized            may you work there today
#   requires_sponsorship  now or at any point later
#   unrestricted          authorized with no sponsorship ever (citizen, permanent resident)
#   status_label          answers "what is your work status" in a text box
#   followup              answers "please explain your visa situation"
#   start_in_days         your start date is this many days after the form is filled
#   visa_salary_floor     optional: the lowest gross salary that country's work visa
#                         allows, {amount, currency (ISO code), per: year | month, note}
#   salary                optional: what a salary question asks for there, {amount,
#                         currency (required), markup_pct, lanes}. markup_pct (own country
#                         only): a posting's minimum in `currency` times it, ahead of
#                         amount. lanes: the lanes it answers for (absent: every lane).
# us_person: park | yes | no — the export-control "U.S. person" question. Quote it.
work_authorization:
  us_person: "park"
  nationalities: ["Exampleland"]
  countries:
    default: {authorized: false, requires_sponsorship: true}
    United States:
      authorized: true
      requires_sponsorship: true
      status_label: "F-1 STEM OPT"
      followup: "Authorized under F-1 STEM OPT; will need sponsorship when it ends."
      start_in_days: 14
      # salary: {amount: 110000, currency: USD, markup_pct: 10}
    # Germany:
    #   authorized: false
    #   requires_sponsorship: true
    #   visa_salary_floor: {amount: 48300, currency: EUR, per: year, note: "EU Blue Card"}

# Facts about you, one plain sentence each, for the questions a form asks in
# its own words. The id matches F-<UPPERCASE-WORDS>. Say what is true and when:
# "today" and "later" are different answers.
facts:
  F-CITIZENSHIP: "Citizen of Exampleland only; not a US citizen or permanent resident."
  F-VISA: "Holds F-1 status with STEM OPT, authorized to work in the United States today."
  F-SPONSORSHIP-NOW: "Needs no visa sponsorship to start work in the United States today."
  F-SPONSORSHIP-LATER: "Will need H-1B sponsorship in the United States when OPT ends."
  F-ONSITE: "Will work onsite or hybrid anywhere in the United States, up to five days a week."
  F-RELOCATION: "Willing to relocate within the United States; needs no relocation assistance."
  F-WIDGET-CAD-YEARS: "4 years of professional Widget CAD."
  F-GEARBOX-SIM-YEARS: "2 years of gearbox simulation."
  F-ADULT: "Is over 18 years old."
  F-CONSENT-DATA-RETENTION: "Consents to the employer keeping the application on file for future roles."
  F-ATTESTATIONS: "Agrees to standard attestations: answers are accurate and complete, and completed the application myself."
  F-AI-INTERVIEW: "Will not use AI tools during interviews unless the employer permits them."

# One entry per question you want answered the same way everywhere. An answer
# is text, a list of spellings (the first the board offers wins), or
# {fact: identity.first_name}, {computed: salary | start_date | how_heard | cover_letter},
# {role_file: why_company} (this role's company_answers.yaml).
questions:
  linkedin:
    answer: "https://linkedin.com/in/example"
  website:
    answer: "https://example.com"
  salary:
    # The `salary` on the role's country row (work_authorization). "Yes" answers
    # a Yes/No "is the posted range acceptable?".
    answer: {computed: salary, fallback: ["Yes"]}
  start_date:
    answer: {computed: start_date}
  how_did_you_hear:
    answer: {computed: how_heard, fallback: ["Careers Page", "Company Website", "Other"]}
  pronouns:
    answer: ["They/Them"]
  languages_fluent:
    # The languages you speak. /score also reads it: a JD requiring another is skipped.
    answer: ["English"]
  legal_first_name:
    answer: {fact: identity.first_name}
  current_company:
    answer: {fact: employment.company_name}
    only_when_required: true
  why_company:
    answer: {role_file: why_company}
  why_role:
    answer: {role_file: why_role}
  what_interests_you_about_product:
    answer: {role_file: what_interests_you_about_product}
  cover_letter_text:
    # A cover-letter text box: this role's cover_letter.yaml as text.
    answer: {computed: cover_letter}

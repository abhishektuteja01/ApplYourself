# Lane `example_primary`: listed in verticals.yaml `lanes:`, merged over its `defaults:`.
display_name: Widget Engineering
# The lane's resume shape. Picks live on bullets (default_for) and
# skills (show), so this block names no ids.
resume:
  sections: [summary, work, projects, education, skills]
  bullets: [4, 6]
  skill_lines:
    - "Domain & Enterprise"
    - "Programming"
    - "AI & Machine Learning"
    - "Databases & Tools"
  summary: >-
    Widget operations analyst who reconciles plant output, configures assembly lines and builds Python and SQL tooling for sprocket compliance data.
search_terms:
  # spine
  - Widget Engineer
  - Widget Platform Analyst
  - Gizmo Systems Consultant
  # adjacent
  - Widget Operations Analyst
# Every searching source reads search_terms. Optional: linkedin_terms (and
# abroad_terms) replace it on LinkedIn (and abroad).
linkedin_terms:
  - Widget Engineer
  - Gizmo Systems Consultant
# Optional. Replaces the same keys of verticals.yaml `defaults: score:`, one
# by one (here: this lane's sheet and retention line).
# score:
#   cutoff: 80

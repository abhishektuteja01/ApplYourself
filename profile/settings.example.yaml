# Machine settings: the night run, writing limits and the /apply browser.
#
# Overnight chain run by scripts/nightly_pipeline.sh. `uv run apply sheet` reads
# table_path (its cutoff is scoring.yaml cutoffs.sheet); the stage scripts read
# the keys further down.

table_path: top_scored_open.xlsx

# Headless stage runner (scripts/nightly_pipeline.sh).
tailor_parallel: 2           # most /tailor calls running at once
tailor_stagger_seconds: 60   # one /tailor started this often, so Word and the API are not hit at once
retries: 1                   # a failed tailor or owed judge is retried this many times
max_budget_usd_per_call: 10  # spend cap for one claude -p call
tailor_max_per_night: 0      # most roles /tailor takes a night; the rest wait (0 = no cap)
apply_prep_max_per_night: 0  # most roles /apply takes a night (0 = no cap)

# Synonyms stage (/suggest-synonyms --auto).
auto_add_synonyms: true      # add the ready-to-add rephrasings without asking
unlock_max_open: 5           # memory-unlock questions waiting for your yes/no at once

# Mail summary.html here after each night (through the Mail app). Leave it out to skip.
# summary_email: you@example.com

# Tracking and submission.
ghosted_after_days: 30       # an `applied` role with no update this long shows as ghosted
company_cooldown_days: 2     # no batch submit to a company applied to this recently

# Outreach drafts (`uv run app build outreach`): most words in the body per
# channel (recruiter per medium), and in an email subject line.
outreach_word_limits:
  recruiter_linkedin: 90
  recruiter_email: 150
  referral: 120
  alumni: 100
  subject: 8

# Which browser drives the /apply form. patchright | playwright.
browser:
  driver: patchright
  stealth: true

# Machine settings: the night run, writing limits and the /apply browser.
#
# Overnight chain run by scripts/nightly_pipeline.sh. `uv run apply sheet` reads
# table_path (its cutoff is each lane's verticals.yaml `score.cutoff`); the
# stage scripts read the keys further down.

schema_version: 1
table_path: top_scored_open.xlsx
# A role /apply can fill joins the sheet from this score, below its lane's
# cutoff. Absent: the lane's cutoff only.
sheet_submittable_cutoff: 72

# Headless stage runner (scripts/nightly_pipeline.sh).
tailor_parallel: 2           # most /tailor calls running at once
judge_parallel: 8            # most score judges running at once (absent = 8)
tailor_stagger_seconds: 60   # one /tailor started this often, so Word and the API are not hit at once
retries: 1                   # a failed tailor or owed judge is retried this many times
max_budget_usd_per_call: 10  # spend cap for one claude -p call
# max_spend_usd_per_night: 30  # once a night's claude calls cost this, later claude stages wait (absent = no cap)
tailor_max_per_night: 0      # most roles /tailor takes a night; the rest wait (0 = no cap)
# The tailor stage skips, and the summary lists (absent: data/defaults/settings_defaults.yaml):
# tailor_min_jd_chars: 1000    # a role whose JD is shorter (0 = never)
# tailor_live_check_days: 30   # a role posted longer ago whose board says it is gone (0 = never check)
# tailor_dupe_min_jd: 95       # a maybe duplicate, at this JD score, of a role tailored, applied or picked tonight
apply_prep_max_per_night: 0  # most roles /apply takes a night (0 = no cap)
# A stage that hits the claude usage limit waits for the reset, then runs again.
usage_limit_wait_until: "19:00"  # latest local time (quoted HH:MM) a wait may end, before the night's start; absent = no waits
usage_limit_poll_minutes: 15     # no reset time in the message: retry after this, doubling

# Synonyms stage (/suggest-synonyms --auto).
auto_add_synonyms: true      # add the ready-to-add rephrasings without asking
unlock_max_open: 5           # memory-unlock questions waiting for your yes/no at once

# Mail summary.html here after each night (through the Mail app). Leave it out to skip.
# summary_email: you@example.com

# summary.md lists, per lane, title words no search term or classifier rule
# covers, from titles at or above the lane's cutoff scored in this many days.
# Leave it out to skip. Nothing is written to config.
uncovered_words_days: 14

# Tracking and submission.
ghosted_after_days: 30       # an `applied` role with no update this long shows as ghosted
company_cooldown_days: 2     # no batch submit to a company applied to this recently

# Outreach drafts (`uv run app build outreach`): most words in the body per
# channel (recruiter per medium), and in an email subject line.
outreach_word_limits:
  recruiter_linkedin: 90
  recruiter_email: 150
  referral: 120
  alumni: 100
  subject: 8

# Which browser drives the /apply form. patchright | playwright.
browser:
  driver: patchright
  stealth: true

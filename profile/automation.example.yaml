# Overnight chain run by scripts/nightly_pipeline.sh. `uv run apply sheet` reads
# table_path and score_threshold; the stage scripts read the keys further down.

score_threshold: 85
table_path: top_scored_open.xlsx

# Headless stage runner (scripts/nightly_pipeline.sh).
tailor_parallel: 2           # most /tailor calls running at once
tailor_stagger_seconds: 60   # one /tailor started this often, so Word and the API are not hit at once
retries: 1                   # a failed tailor or owed judge is retried this many times
max_budget_usd_per_call: 10  # spend cap for one claude -p call

# Synonyms stage (/suggest-synonyms --auto).
auto_add_synonyms: true      # add the ready-to-add rephrasings without asking
unlock_max_open: 5           # memory-unlock questions waiting for your yes/no at once

# Mail summary.html here after each night (through the Mail app). Leave it out to skip.
summary_email: you@example.com

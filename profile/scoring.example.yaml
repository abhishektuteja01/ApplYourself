# TEMPLATE — copy to profile/scoring.yaml and edit (/onboarding does both).
#
# Scoring policy for /score. Read by src/applyourself/score_filter.py, src/applyourself/score_store.py
# and src/applyourself/shortlist.py. Per-lane rules (`score:` penalties and
# cutoff) live in profile/verticals.yaml `defaults:` and each lane.yaml; how to
# judge a role lives in .claude/shared/scoring_rubric.md and
# profile/verticals/<lane>/rubric.md.
# Your sponsorship need in each country comes from
# profile/application_answers.yaml's work_authorization.countries.
schema_version: 1

# Roles you can never take. A JD holding one is dropped before any judge and
# labeled ineligible. Whole words, any case; "U.S." and "United States" read
# as "US". Conditional wording ("now or in the future") stays with the judge:
# it also appears verbatim in neutral application-form questions.
ineligible:
  - us citizenship required
  - us citizenship is required
  - must be a us citizen
  - us citizens only
  - green card required
  - active security clearance
  - ability to obtain a security clearance
  - public trust clearance
  - top secret clearance
  - ts/sci clearance
  - requires security clearance
  - requires a security clearance
  - does require security clearance
  - security clearance is required
  - security clearance required
  - secret clearance required
  - citizen or green card

# The employer will not sponsor. Dropped only when you need sponsorship now at home.
no_sponsorship:
  - no sponsorship
  - no visa sponsorship
  - unable to sponsor
  - will not sponsor
  - do not sponsor
  - does not sponsor

# How many keywords_to_mirror a role keeps for /tailor; extras are dropped.
keywords_max: 5

# A JD under min_words has its fit capped at fit_cap.
jd_quality:
  min_words: 300
  fit_cap: 78

# Score cutoffs, review at or below tailor. They set suggested_action. The
# line for the night's status sheet (settings.yaml table_path) and for
# keeping a role retention.high_days (discovery.yaml) is each lane's
# `score.cutoff` in verticals.yaml. An optional keep_long keeps roles that
# long from a lower score too.
cutoffs:
  review: 50
  tailor: 60

# Sections cut from the judge's copy of a JD. A section starts at a heading
# that begins with one of `headings` and runs to the next heading. A
# paragraph holding any keep word always stays.
trim_jd:
  headings:
    - equal opportunity
    - equal employment
    - eeo
    - benefits
    - perks
    - what we offer
    - why join
    - why work
    - about us
    - who we are
    - our values
    - our culture
    - life at
    - accommodation
    - reasonable accommodation
    - privacy
    - diversity
    - e-verify
  keep_words:
    - sponsor
    - visa
    - citizen
    - clearance
    - authoriz
    - salary
    - compensation
    - years

shortlist:
  top_n: 25
  # Shown in their own "In pipeline" section. Every other tracked state
  # (applied and later, skip, withdrawn) is left off the shortlist.
  pipeline_states: [saved, tailored]
  # How many of them to list, highest fit first; the section header keeps
  # the full count.
  pipeline_show: 10
  # Tie-break after fit_score, best first.
  sponsorship_order: [sponsors, opt_ok, unknown]
  # One line under the header; "" for none.
  note: "Verify E-Verify before submitting (manual step)."

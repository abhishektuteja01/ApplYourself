# TEMPLATE — copy to profile/verticals.yaml and edit.
# Also copy profile/verticals/example_primary/ -> profile/verticals/<your_name>/
# for each vertical you define (each dir needs lane.yaml, rubric.md and
# tailoring.md). Each lane's block is its lane.yaml.
#
# Three fictional verticals demonstrate every feature:
#   - `lanes:` order = shortlist section order; first = primary
#   - `defaults:` sits under every lane.yaml (here the shared `years` table)
#   - classifier_rules order = ambiguity policy (first match wins; one vertical
#     may own several rules at different priorities); a rule is a `pattern`
#     regex, a `{match, require_any}` pair, or a `terms` list
#   - a title fits a lane when one of its rules or search terms matches it;
#     it passes unless it holds a `title_exclude_terms` ban word
#   - a lane whose titles collide with both others, so its rule sits below
#     theirs (example_tertiary)
# Vertical names must match ^[a-z][a-z0-9_]*$ — they become parquet values,
# applications/<name>/ directories, and staging-file suffixes.

schema_version: 2
default_vertical: example_primary

# Shortlist order (first = primary). Each lane is verticals/<lane>/lane.yaml.
lanes: [example_primary, example_secondary, example_tertiary]

# Under every lane's lane.yaml: a lane's list comes first, then the list here;
# any other key a lane sets replaces the one here.
defaults:
  years: {3: 14, 4: 10}
  # One title ban list for every lane: whole words, any case, matched as
  # written. Keep it to titles you would never take; level words (intern,
  # VP, senior, lead) are the judge's.
  title_exclude_terms:
    - director
    - head of
    - svp
    - evp
    - distinguished
    - thesis
    - working student
    - registered nurse
    - truck driver
    - forklift operator

# Words a title may spell either way. Every term a lane matches loosely (its
# search terms, `terms` rules, `{match, require_any}` rules) reads them all,
# so "Widget Engineer" also fits "Widget-Ingenieur".
title_variants:
  - [engineer, ingenieur, ingénieur]
  - [developer, entwickler, ontwikkelaar]

# Ordered — first match wins. example_primary owns two rules at different
# priorities: a strong signal ABOVE example_secondary (unambiguous primary
# always wins) and a generic catch-all BELOW it (ambiguity defaults to
# primary). Titles matching nothing classify as "" (out-of-lane).
classifier_rules:
  - vertical: example_primary
    pattern: '\b(?:widget|gizmo)\b'
  - vertical: example_secondary
    pattern: '\b(?:sprocket|governance|compliance)\b'
  - vertical: example_tertiary
    pattern: '\bcog\b'
  # A `terms` list: any one term, matched loosely (hyphens, spaces, plurals,
  # word endings, title_variants), never from inside a word.
  - vertical: example_secondary
    terms: [sprocket model risk, sprocket assurance]
  - vertical: example_primary
    pattern: '\b(?:operations|systems? analyst)\b'

# JD-text-only sponsorship labeling. Read by /score BEFORE fit-scoring.
# Precedence: ineligible wins outright -> opt_ok -> sponsors -> unknown.
# false_positive_guard phrases alone are NEVER blockers.
#
# THESE LISTS ASSUME YOU ARE ALREADY AUTHORIZED TO WORK and do not need
# sponsorship right now. profile/preferences.md is the source of truth for your
# status; if it says you need sponsorship, two edits are required:
#   1. Move every `opt_ok:` phrase into `ineligible:`. They mean the employer
#      will not sponsor — harmless if you need nothing, disqualifying if you do.
#      Left in place they label those postings opt_ok, which shortlists and
#      tailors roles you cannot accept.
#   2. Empty `false_positive_guard:`, whose phrases are boilerplate only for
#      someone already authorized.
# Labels: sponsors | opt_ok | ineligible | unknown.

# Deterministic pre-label (src/scoring_io.py carve-out): unambiguous
# clearance/citizenship substrings ONLY. Matching rows are labeled ineligible
# before any judge runs — same shortlist exclusion as a judge label. Nuanced
# wording (the "now or in the future" family, which appears verbatim in neutral
# application-form questions) MUST stay out of this list — judge-only, below.
hard_ineligible:
  - "US citizenship required"
  - "must be a US citizen"
  - "green card required"
  - "active security clearance"
  - "ability to obtain a security clearance"
  - "public trust clearance"

ineligible:
  - "US citizenship required"
  - "must be a US citizen"
  - "green card required"
  - "active security clearance"
  - "ability to obtain a security clearance"
  - "public trust clearance"
  - "not provide sponsorship now or in the future"
  - "not sponsor now or in the future"
  - "require sponsorship now or in the future"
  - "not now or in the future require sponsorship"
  - "does not now or in the future require"

opt_ok:
  - "no sponsorship"
  - "unable to sponsor"
  - "will not sponsor"
  - "no visa sponsorship"

sponsors:
  - "visa sponsorship"
  - "H-1B sponsorship"
  - "sponsorship available"
  - "willing to sponsor"

false_positive_guard:
  - "must be authorized to work in the US"
  - "work authorization required"
  - "authorized to work in the United States"

# Rows located only in a "Visa needed" country (profile/preferences.md,
# "## Work countries") use this block instead of the lists above. Abroad there
# is no opt_ok: needing no sponsorship is not an option.
# Precedence: ineligible -> conditional without a sponsors match -> sponsors -> unknown.
abroad:
  ineligible:
    - "EU citizenship required"
    - "must hold EU citizenship"
    - "unrestricted work permit"
    - "visa sponsorship is not available"
    - "unable to provide visa sponsorship"
    - "no visa sponsorship"
    - "no sponsorship"
    - "unable to sponsor"
    - "will not sponsor"
    - "do not sponsor"
    - "without the need for employer sponsorship"
    - "without sponsorship"
    - "already be eligible to work"
    - "without any time limitations"
    - "not support relocation or visa sponsorship"
  # Ineligible unless a `sponsors` phrase below also matches.
  conditional:
    - "right to work in"
    - "eligible to work in"
    - "legally able to work in"
    - "legal right to work"
    - "valid work permit"
    - "work permit are required"
    - "eligible to work within the EU"
    - "existing right to work"
  sponsors:
    - "visa support"
    - "visa sponsorship is available"
    - "sponsor visas"
    - "visa sponsorship where"

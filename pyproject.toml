[project]
name = "applyourself"
version = "0.1.0"
description = "Human-gated, config-driven job-search pipeline: scrape, score, tailor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "abhishektuteja01" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
    "Private :: Do Not Upload",
]
dependencies = [
    # Upper bound: src/discovery/sources/search.py calls LinkedIn._get_job_details, a private API.
    "python-jobspy>=1.1.80,<1.2",
    "pandas>=2.2,<3",
    "pyarrow>=15.0",  # parquet engine for pandas; src/shared/parquet_io.py and the id table import it directly
    "openpyxl>=3.1",  # xlsx engine for pandas; src/apply/sheet.py imports it directly
    "rapidfuzz>=3.6",
    "python-docx>=1.1",
    "lxml>=5.0",  # src/apply HTML parsing; XML surgery in scripts/scrub_example_templates.py
    "pyyaml>=6.0",
    "requests>=2.32",
    "geonamescache>=3.0.1",
    "pycountry>=24.0",
    "pypdf>=6.19.0",
    "pydantic>=2.11",  # src/shared/config_schema.py, src/session_schema.py
]

[project.urls]
Homepage = "https://github.com/abhishektuteja01/ApplYourself"
Repository = "https://github.com/abhishektuteja01/ApplYourself"
Issues = "https://github.com/abhishektuteja01/ApplYourself/issues"

[project.scripts]
ingest-url = "src.discovery.ingest_url:main"
score = "src.score_cli:main"
track = "src.track_cli:main"
app = "src.app_cli:main"
profile-extract = "src.profile_extract:main"
onboard-scaffold = "src.onboard_scaffold:main"
discover = "src.discovery.run:main"
verticals-check = "src.shared.verticals:main"
discovery-check = "src.discovery.config:main"
discover-digest = "src.discovery.digest:main"
discover-dupes = "src.discovery.dedupe:main"
discover-ids = "src.discovery.id_table:main"
apply = "src.apply_cli:main"
synonyms = "src.synonyms_cli:main"
summary = "src.summary:main"
night = "src.night:main"
config = "src.config_cli:main"
config-check = "src.config_check:main"
pdf-broker = "src.pdf_broker:main"
doctor = "src.doctor:main"

[dependency-groups]
dev = [
    "mypy>=2.4,<2.5",
    "pandas-stubs>=2.3,<2.4",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16,<0.17",
    "types-pyyaml>=6.0.12.20261103",
    "types-requests>=2.33.0.20261030",
]
# Opt-in: `uv sync --group apply`. Discovery, scoring and tailoring must keep
# working on a clone that never installs it.
apply = [
    "playwright>=1.47",
    # Drop-in Playwright fork that patches the CDP-side automation leaks the
    # stock driver cannot hide from a form's bot scoring. Selected by
    # `browser.driver` in profile/application_answers.yaml; the stock driver
    # stays installed and stays the fallback.
    "patchright>=1.0",
]
# Opt-in: `uv sync --group discovery`. Needed only by `uv run discover` /
# `uv run ingest-url`; scoring and tailoring must keep working without it.
#
# `postal` binds to the system libpostal C library, which is NOT pip-installable
# and has no wheel: installing this group compiles it against libpostal's
# headers. Install libpostal first or the sync fails.
#   macOS: `brew install libpostal`
#   Linux: build from source (github.com/openvenues/libpostal) — no distro
#     packages it. Needs autoconf/automake/libtool/pkgconf plus a compiler, and
#     `make` downloads ~2GB of model data into --datadir. Export
#     LIBPOSTAL_PREFIX (and LD_LIBRARY_PATH) if you used a non-default --prefix.
# src/shared/location/parser.py imports it lazily, at the one call site, so a clone
# without it can still import discovery — the failure is a clear message when
# address parsing is actually reached.
discovery = [
    "postal>=1.1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF", "DTZ"]
# RUF001-003: dashes and smart quotes are on purpose. The rest would force
# behavior-changing (B905, UP042) or noisy (E501, RUF005, SIM105, SIM108, SIM905) rewrites.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B905", "UP042", "RUF005", "SIM105", "SIM108", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF012", "DTZ"]  # fake classes hold fixture lists; fixtures pin naive local times

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "src.shared.*",
    "src.state_io",
    "src.track_cli",
    "src.score_filter",
    "src.score_store",
    "src.score_cli",
]
# The `strict` flags one by one: `strict = true` here leaks to every module.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Not typed yet: drop a module from this list once it checks clean.
[[tool.mypy.overrides]]
module = [
    "src.app_cli",
    "src.apply.answers",
    "src.apply.ashby",
    "src.apply.bank_schema",
    "src.apply.browser",
    "src.apply.drivers",
    "src.apply.fill",
    "src.apply.greenhouse",
    "src.apply.lever",
    "src.apply.plan",
    "src.apply.reconcile",
    "src.apply.report",
    "src.apply.sheet",
    "src.apply_cli",
    "src.discovery.dedupe",
    "src.discovery.sources.boards.base",
    "src.discovery.sources.boards.workday",
    "src.discovery.sources.feed.stapply",
    "src.discovery.sources.search",
    "src.discovery.store",
    "src.lint",
    "src.resume_model",
    "src.summary",
    "src.synonyms_cli",
]
ignore_errors = true

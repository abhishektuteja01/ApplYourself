[project]
name = "applyourself"
version = "0.1.0"
description = "Human-gated, config-driven job-search pipeline: scrape, score, tailor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "abhishektuteja01" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
    "Private :: Do Not Upload",
]
dependencies = [
    # Exact: src/applyourself/discovery/sources/search.py uses jobspy names outside its public API.
    "python-jobspy==1.1.82",
    "pandas>=2.2,<3",
    "pyarrow>=15.0",  # parquet engine for pandas; src/applyourself/shared/parquet_io.py and the id table import it directly
    "openpyxl>=3.1",  # xlsx engine for pandas; src/applyourself/apply/sheet.py imports it directly
    "rapidfuzz>=3.6",
    "python-docx>=1.1",
    "lxml>=5.0",  # src/applyourself/apply HTML parsing; XML surgery in scripts/scrub_example_templates.py
    "pyyaml>=6.0",
    "requests>=2.32",
    "geonamescache>=3.0.1",
    "pycountry>=24.0",
    "pypdf>=6.19.0",
    "pydantic>=2.11",  # src/applyourself/shared/config_schema.py, src/applyourself/session_schema.py
]

[project.urls]
Homepage = "https://github.com/abhishektuteja01/ApplYourself"
Repository = "https://github.com/abhishektuteja01/ApplYourself"
Issues = "https://github.com/abhishektuteja01/ApplYourself/issues"

[project.scripts]
ingest-url = "applyourself.discovery.ingest_url:main"
score = "applyourself.score_cli:main"
track = "applyourself.track_cli:main"
app = "applyourself.app_cli:main"
profile-extract = "applyourself.profile_extract:main"
onboard-scaffold = "applyourself.onboard_scaffold:main"
discover = "applyourself.discovery.run:main"
verticals-check = "applyourself.shared.verticals:main"
discovery-check = "applyourself.discovery.config:main"
discover-digest = "applyourself.discovery.digest:main"
discover-dupes = "applyourself.discovery.dedupe:main"
discover-ids = "applyourself.discovery.id_table:main"
apply = "applyourself.apply_cli:main"
synonyms = "applyourself.synonyms_cli:main"
summary = "applyourself.summary:main"
night = "applyourself.night:main"
config = "applyourself.config_cli:main"
config-check = "applyourself.config_check:main"
pdf-broker = "applyourself.pdf_broker:main"
doctor = "applyourself.doctor:main"

[dependency-groups]
dev = [
    "mypy>=2.4,<2.5",
    "pandas-stubs>=2.3,<2.4",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16,<0.17",
    "types-pyyaml>=6.0.12.20261103",
    "types-requests>=2.33.0.20261030",
]
# Opt-in: `uv sync --group apply`. Discovery, scoring and tailoring must keep
# working on a clone that never installs it.
apply = [
    "playwright>=1.47",
    # Drop-in Playwright fork that patches the CDP-side automation leaks the
    # stock driver cannot hide from a form's bot scoring. Selected by
    # `browser.driver` in profile/application_answers.yaml; the stock driver
    # stays installed and stays the fallback.
    "patchright>=1.0",
]
# Opt-in: `uv sync --group discovery`. Needed only by `uv run discover` /
# `uv run ingest-url`; scoring and tailoring must keep working without it.
#
# `postal` binds to the system libpostal C library, which is NOT pip-installable
# and has no wheel: installing this group compiles it against libpostal's
# headers. Install libpostal first or the sync fails.
#   macOS: `brew install libpostal`
#   Linux: build from source (github.com/openvenues/libpostal) — no distro
#     packages it. Needs autoconf/automake/libtool/pkgconf plus a compiler, and
#     `make` downloads ~2GB of model data into --datadir. Export
#     LIBPOSTAL_PREFIX (and LD_LIBRARY_PATH) if you used a non-default --prefix.
# src/applyourself/shared/location/parser.py imports it lazily, at the one call site, so a clone
# without it can still import discovery — the failure is a clear message when
# address parsing is actually reached.
discovery = [
    "postal>=1.1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applyourself"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF", "DTZ"]
# RUF001-003: dashes and smart quotes are on purpose. The rest would force
# behavior-changing (UP042: StrEnum changes str()) or noisy (E501, RUF005, SIM905) rewrites.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "UP042", "RUF005", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# Fake classes hold fixture lists; fixtures pin naive local times; zips over fixture rows.
"tests/**" = ["RUF012", "DTZ", "B905"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "applyourself.shared.*",
    "applyourself.state_io",
    "applyourself.track_cli",
    "applyourself.score_filter",
    "applyourself.score_store",
    "applyourself.score_cli",
    "applyourself.lint",
    "applyourself.app_cli",
    "applyourself.material.*",
    "applyourself.apply.greenhouse",
    "applyourself.apply.reconcile",
    "applyourself.apply.report",
]
# The `strict` flags one by one: `strict = true` here leaks to every module.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Not typed yet: drop a module from this list once it checks clean.
[[tool.mypy.overrides]]
module = [
    "applyourself.apply.bank_schema",
    "applyourself.apply.fill",
    "applyourself.apply.sheet",
    "applyourself.apply_cli",
    "applyourself.discovery.sources.boards.base",
    "applyourself.discovery.store",
    "applyourself.summary",
    "applyourself.synonyms_cli",
]
ignore_errors = true

[project]
name = "auto-app-filler"
version = "0.1.0"
description = "Personal, human-gated job-search pipeline (F-1 OPT, SAP ACM functional)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-jobspy>=1.1.80",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "rapidfuzz>=3.6",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "geonamescache>=3.0.1",
]

[project.scripts]
ingest-url = "src.discovery.ingest_url:main"
score = "src.score_cli:main"
track = "src.track_cli:main"
tailor-prep = "src.tailor_cli:main"
discover = "src.discovery.orchestrator:main"
verticals-check = "src.verticals:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

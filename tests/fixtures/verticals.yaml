# Test fixture — mirror of the real profile/verticals.yaml.
#
# Kept byte-identical to the real config below the banner so the strict loader
# and the classifier/title-gate tests run against production rules.
# test_fixtures_mirror_real_config guards the sync.
#
# Contains real job-search strategy (search terms, exclude lists, skill
# weights). Sanitize before pushing this repo anywhere public.

# Vertical registry — single source of truth. USER DATA, gitignored.
# `verticals` order = shortlist order (first = primary).
# `classifier_rules` order = ambiguity policy (first match wins).


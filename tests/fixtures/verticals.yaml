    # Weighted skill taxonomy for the jd_skill_overlap axis (0-30).
    # Weights are 0-10 integers; ACM/commodity_management > generic SAP > all else.
    # Based solely on attested experience in profile/bullets.md and this
    # vertical's resume_file.
    # Tune as real shortlists surface mis-weighted matches.
    skill_weights:
      sap:
        acm: 10                   # Agricultural Contract Management — 2yr production spine
        s4hana: 9                 # S/4HANA — global rollouts LATAM/EMEA/APAC
        bw_reconciliation: 9      # Daily ACM-to-BW MTM position reconciliation
        production_support: 8     # Daily defect triage, fix specification, DEV→UAT cycle
        global_rollout: 7         # Multi-country implementation and localization support
        uat: 7                    # UAT validation cycle across the contract-to-settlement chain
        signavio: 7               # Process mapping and risk/controls review (O&G engagement)
        sd_integration: 6         # ACM–SD sales-contract touchpoints (not standalone SD config)
        fi_integration: 5         # ACM–FI settlement posting validation
      domain:
        commodities_trading: 10   # Fortune 100 agri-commodity trading client, 2+ years
        mark_to_market: 10        # Daily stock MTM risk report — owned end-to-end
        risk_recon: 9             # P&L validation, long/short exposure, position reconciliation
        sox_rcm: 8                # SOX/Non-SOX RCM maintenance through stakeholder sign-off
        oil_gas: 5                # Downstream O&G client (secondary; Signavio engagement)
    disqualifier:
      # Phrase bundle added 2026-07-14 from a mined analysis of 760 judged
      # sap rows (fit<60 vs >=70 contrast, zero >=70 hits per phrase; 7
      # historical hits in the 65-69 band accepted knowingly). Two flagged
      # substring quirks, accepted: "sap pm" also catches "SAP PMO" and
      # "sap pp" catches "SAP PPM" — both out-of-lane anyway, never >=65.
      # Categories: non-ACM SAP module specializations (HCM/payroll/PP/PM/
      # Basis/BTP/Concur/SuccessFactors), competing ERP platforms
      # (Workday/NetSuite/PeopleSoft), architect-level hiring pools.
      max_years: 4
      phrases:
        - successfactors
        - payroll
        - hcm
        - sap pm
        - sap pp
        - production planning
        - plant maintenance
        - sap basis
        - sap btp
        - concur
        - solution architect
        - workday
        - netsuite
        - peoplesoft
      # Title-level disqualifier (mechanism + mining 2026-07-14).
      # Seniority families and adjacent title families (buyer/sourcing/
      # procurement/engineer) with zero >=70 scores across 760 judged rows.
      # Known 65-69 casualties accepted: "senior" (2 — e.g. Senior SAP FICO
      # Consultant at 65-69; a senior title never reached 70 for this
      # profile). Substring semantics — "lead" also catches "leader" etc.,
      # intended.
      title_phrases:
        - senior
        - manager
        - director
        - principal
        - lead
        - architect
        - head of
        - vice president
        - buyer
        - sourcing
        - procurement
        - engineer
        # Added 2026-07-15 (mined vs today's-config residual, 146 low<50 vs
        # 120 surviving >=50; both zero >=50 hits): FICO/financial-analyst
        # and security title pools outside the ACM lane.
        - financial
        - security
      reasoning_title: >-
        Auto-skipped: title matches a sap title-disqualifier phrase (seniority
        or adjacent family — buyer/sourcing/procurement/engineer/financial/security).
      scored_by: "rubric:sap-jd-years-disqualifier"
      reasoning_phrase: >-
        Auto-skipped: JD contains a sap disqualifier phrase (non-ACM SAP module,
        competing ERP, or architect-level pool).
      reasoning_years: >-
        Auto-skipped: JD requires more years of experience than this vertical's
        max_years.


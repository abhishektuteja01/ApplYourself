# Synthetic test fixture — three fictional verticals. Contains no real
# search terms, exclude lists, or skill weights.
#
# Mirrored byte-for-byte at tests/fixtures/verticals.yaml and
# tests/discovery/fixtures/verticals.yaml; TestFixtureMirrors enforces it.
# Shaped after profile/verticals.example.yaml and enriched so every schema
# branch is covered: include-gate on, strong-keep override, phrase/title/years
# disqualifiers, regex + literal + compound classifier rules, and one vertical
# owning rules at two priorities.
#
# Real-config coverage lives in tests/test_real_config_drift.py, which runs
# only on a machine that has profile/verticals.yaml.

schema_version: 1
# Deliberately not the first vertical: nothing may assume default == names[0].
default_vertical: example_tertiary

verticals:
  example_primary:
    display_name: Widget Engineering
    resume_file: profile/verticals/example_primary/resume_example_primary.md
    # No term contains "Engineer" — "engineer" is a title disqualifier here.
    search_terms:
      - Widget Functional Consultant
      - Widget Platform Analyst
      - Widget Operations Analyst
      - Gizmo Systems Consultant
      - Gizmo Reconciliation Analyst
    linkedin_terms:
      - Widget Functional Consultant
      - Gizmo Systems Consultant
    title_include_terms:
      - widget
      - gizmo
      - doohickey
    title_exclude_terms:
      - senior
      - principal
      - lead
      - head of
      - clinical
      - nurse
      - rival doohickey
    skill_weights:
      widgets:
        widget_assembly: 10
        gizmo_calibration: 7
      domain:
        widget_supply_chain: 9
    disqualifier:
      max_years: 4
      phrases:
        - rival widget suite
        - legacy gizmo stack
        - widget payroll module
        - solution architect
      title_phrases:
        - senior
        - manager
        - director
        - principal
        - lead
        - architect
        - head of
        - vice president
        - buyer
        - sourcing
        - procurement
        - engineer
      scored_by: "rubric:example-primary-jd-years-disqualifier"
      reasoning_phrase: >-
        Auto-skipped: JD contains an example_primary disqualifier phrase
        (competing vendor stack or architect-level pool).
      reasoning_title: >-
        Auto-skipped: title matches an example_primary title-disqualifier
        phrase (seniority or adjacent family).
      reasoning_years: >-
        Auto-skipped: JD requires more years of experience than this
        vertical's max_years.

  example_secondary:
    display_name: Sprocket Compliance
    resume_file: profile/verticals/example_secondary/resume_example_secondary.md
    search_terms:
      - Sprocket Risk
      - Sprocket Validation
      - Sprocket Governance
      - Sprocket Risk Management
      - Sprocket Compliance Analyst
      - Cog Governance Analyst
    linkedin_terms:
      - Sprocket Risk
      - Sprocket Governance
    title_include_terms:
      - sprocket
      - governance
      - compliance
      - quantitative sprocket
    title_exclude_terms:
      - software engineer
      - cog learning
      - quality
      - clinical
      - privacy
      - nurse
    title_strong_keep_terms:
      - sprocket risk management
    skill_weights:
      sprocket_risk:
        sprocket_validation: 9
        sprocket_governance: 8
      sprocket_quant:
        sprocket_backtesting: 6
    disqualifier:
      max_years: 4
      phrases:
        - phd required
        - ph.d. required
        - doctorate required
        - sprocket charter required
        - sprocket certification required
        - legacy sprocket ledger
        - vendor sprocket risk
      title_phrases:
        - quality
        - clinical
        - privacy
        - automation
        - operations
        - nurse
        - data analyst
        - developer
      scored_by: "rubric:example-secondary-jd-disqualifier"
      reasoning_phrase: >-
        Auto-skipped: JD contains an example_secondary disqualifier phrase
        (credential requirement, legacy ledger, or vendor-risk stack).
      reasoning_title: >-
        Auto-skipped: title matches an example_secondary title-disqualifier
        phrase (adjacent validation family or generic analyst/developer).
      reasoning_years: >-
        Auto-skipped: JD requires more years of experience than this
        vertical's max_years.

  example_tertiary:
    display_name: Cog Engineering
    resume_file: profile/verticals/example_tertiary/resume_example_tertiary.md
    search_terms:
      - Cog Engineer
      - Applied Cog Engineer
      - Flywheel Cog Engineer
      - Cog Deployment Engineer
      - Cog Platform Engineer
    linkedin_terms:
      - Cog Engineer
      - Cog Deployment Engineer
    title_include_terms:
      - cog
      - flywheel
      - cog deployment
    title_exclude_terms:
      - senior
      - lead
      - distinguished
      - research scientist
      - cog learning
    title_strong_keep_terms:
      - cog learning platform
      - cog learning agents
    skill_weights:
      cog_stack:
        cog_agents: 9
        cog_platform: 8
    disqualifier:
      max_years: 4
      phrases:
        - phd required
        - ph.d. required
        - doctorate required
        - autonomous cogs
        - cog firmware
      title_phrases:
        - scientist
        - manager
      scored_by: "rubric:example-tertiary-jd-disqualifier"
      reasoning_phrase: >-
        Auto-skipped: JD contains an example_tertiary disqualifier phrase
        (doctorate requirement or embedded/firmware pool).
      reasoning_title: >-
        Auto-skipped: title matches an example_tertiary title-disqualifier
        phrase (research or people-management pool).
      reasoning_years: >-
        Auto-skipped: JD requires more years of experience than this
        vertical's max_years.

out_of_lane:
  reasoning: >-
    Out-of-lane: title contains no in-lane keyword, so title_match=0 and the
    row cannot reach the fit>=50 shortlist.

# Ordered — first match wins. example_primary owns two rules: a strong signal
# above everything, and a generic catch-all below everything (ambiguity
# defaults to primary). Precedence: primary-strong > secondary > tertiary >
# primary-catch-all.
classifier_rules:
  - vertical: example_primary
    pattern: '\b(?:widget|gizmo|doohickey)\b'
  - vertical: example_secondary
    pattern: '\b(?:sprocket|governance|compliance|quant\w*|cog\s+(?:risk|governance|compliance))\b'
  - vertical: example_tertiary
    pattern: "Cog Engineer"
  - vertical: example_tertiary
    pattern: "Applied Cog"
  - vertical: example_tertiary
    pattern: "Flywheel Cog"
  - vertical: example_tertiary
    pattern: "Cog Agent"
  - vertical: example_tertiary
    pattern: "Cog Platform"
  - vertical: example_tertiary
    pattern:
      match: "Cog Deployment"
      require_any: ["Engineer"]
  # Compound: bare "Cog Learning Engineer" is out-of-lane by charter; only a
  # platform/agents qualifier pulls it into the lane.
  - vertical: example_tertiary
    pattern:
      match: "Cog Learning"
      require_any:
        - Platform
        - Agents
  - vertical: example_primary
    pattern: '\b(?:functional|business analyst|systems? analyst|operations|risk|audit\w*|reconciliation)\b'

# Vertical registry — single source of truth for vertical definitions.
# USER DATA, gitignored (job-search strategy). New users copy
# profile/verticals.example.yaml + the profile/verticals/example_* dirs.
#
# Mapping order under `verticals:` is load-bearing: shortlist section order,
# and "primary" = first. classifier_rules order is the ambiguity policy —
# first match wins.

schema_version: 1
default_vertical: sap

verticals:

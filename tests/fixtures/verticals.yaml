      # "risk" title families that job boards fuzzy-match into this lane
      # (Quality/Clinical Validation, Privacy, Ops, QA Automation, Nursing).
      # Seniority words (manager/director/VP) deliberately NOT listed —
      # "Manager, AI Risk Management" and "Director, AI Risk Management"
      # scored >=70 here, unlike sap. "cyber" also excluded: a Cybersecurity
      # + AI Governance hybrid hit 65-69.
      title_phrases:
        - quality
        - clinical
        - privacy
        - automation
        - operations
        - nurse
        # Added 2026-07-15 (mined vs today's-config residual, 346 low<50 vs
        # 153 surviving >=50; every phrase zero >=50 hits): generic analyst/
        # developer/banking title families that search terms fuzzy-match into
        # this lane. "policy" and "services" accepted knowingly as broad
        # substrings (would also catch a future "AI Policy Analyst" /
        # "Financial Services Risk Analyst") — user-approved 2026-07-15.
        - business analyst
        - data analyst
        - financial analyst
        - senior data
        - systems analyst
        - business systems
        - developer
        - banking
        - services
        - policy
        - compliance specialist
      reasoning_title: >-
        Auto-skipped: title matches a risk_ai title-disqualifier phrase
        (non-financial validation/risk or generic analyst/developer/banking
        family).
      scored_by: "rubric:risk-ai-jd-disqualifier"
      reasoning_phrase: >-
        Auto-skipped: JD contains a risk_ai disqualifier phrase (PhD/CFA/FRM
        required, credit/actuarial/AML, front-office trading platform, or
        Salesforce/vendor-risk stack).
      reasoning_years: >-
        Auto-skipped: JD requires more years of experience than this vertical's
        max_years.

out_of_lane:
  reasoning: >-
    Out-of-lane: title contains no in-lane keyword, so title_match=0 and the
    row cannot reach the fit>=50 shortlist.

# Ordered title-classifier rules — the fallback for rows with no search term
# (manual inbox clips, legacy backfill). First match wins. Current order
# encodes the locked "primary on ambiguity" rule: unambiguous SAP
# signal > Risk-AI signal > AI-engineering signal > generic SAP-adjacent
# catch-all (bare "Risk Analyst" defaults to sap). A title matching nothing
# classifies as "".
classifier_rules:
  - vertical: sap
    pattern: '\b(?:sap|acm|s/?4(?:hana)?|etrm|ctrm|o2c|order to cash|sales and distribution|commodit\w*|signavio|mark[- ]to[- ]market|reconciliation|recon|erp)\b'
  - vertical: risk_ai
    pattern: '\b(?:model\s+risk|model\s+validation|model\s+development|validation|governance|grc|quant\w*|responsible\s+ai|trading\s+risk|financial\s+risk|market\s+risk|credit\s+risk|operational\s+risk|enterprise\s+risk|risk\s*(?:&|and)\s*compliance|ai\s+risk|ai\s+compliance|artificial\s+intelligence\s+(?:risk|governance|compliance))\b'
  - vertical: ai_eng
    pattern: "AI Engineer"
  - vertical: ai_eng
    pattern: "AI Software Engineer"
  # Families the "AI Engineer" literal misses: spelled-out "Artificial
  # Intelligence", the AI Application(s)/Developer/Agent titles. Ordered after
  # risk_ai, so governance/risk titles still land there first.
  - vertical: ai_eng
    pattern: "Artificial Intelligence"
  - vertical: ai_eng
    pattern: "AI Application"
  - vertical: ai_eng
    pattern: "AI Developer"
  - vertical: ai_eng
    pattern: "AI Agent"
  - vertical: ai_eng
    pattern: "LLM"
  - vertical: ai_eng
    pattern: "GenAI"
  - vertical: ai_eng
    pattern: "Generative AI"
  - vertical: ai_eng
    pattern: "Applied AI"
  - vertical: ai_eng
    pattern: "AI Agents"
  - vertical: ai_eng
    pattern: "AI Solution"
  - vertical: ai_eng
    pattern:
      match: "Forward Deployed"
      require_any: ["Engineer"]
  - vertical: ai_eng
    pattern:
      match: "ML Engineer"
      require_any:
        - "LLM"
        - "GenAI"
        - "Generative"
        - "NLP"
        - "Foundation Model"
  - vertical: ai_eng
    pattern:
      match: "Machine Learning"
      require_any:
        - "LLM"
        - "GenAI"
        - "Generative"
        - "NLP"
        - "Foundation Model"
  - vertical: ai_eng
    pattern:
      match: "Research Engineer"
      require_any:
        - "LLM"
        - "GenAI"
        - "Generative"
        - "NLP"
        - "Foundation Model"
  - vertical: sap
    pattern: '\b(?:functional|business analyst|systems? analyst|sox|risk|internal\s+controls|it\s+controls|risk[- &]+controls|trad\w*|surveillance|advisory|audit\w*|compliance)\b'

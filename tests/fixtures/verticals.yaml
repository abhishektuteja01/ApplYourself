      # ~80% SAP functional spine
      - SAP Functional Analyst
      - SAP Functional Consultant
      - SAP ACM
      - SAP Commodity Management
      - SAP ETRM
      - SAP CTRM
      - SAP IS-OIL
      - SAP S/4HANA Consultant
      - SAP Business Analyst
      # Module/process spine — what in-lane keepers are actually titled.

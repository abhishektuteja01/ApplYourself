      - AI Engineer
      - Generative AI Engineer
      - LLM Engineer
      - AI Software Engineer
      - AI Application Engineer
      - Applied AI Engineer
      - Artificial Intelligence Engineer
      - Agentic AI Engineer
      - Forward Deployed Engineer
    title_exclude_terms:
      - Senior
      - Sr
      - Staff
      - Principal
      - Lead
      - Director
      - VP
      - Vice President
      - Head
      - Manager
    # Anchored ONLY to B-PROVA-01/04/05/06, B-CAPTRACK-01/02/04/05, and
    # B-TA-01 (supporting) per the Stage 0 charter. Ceiling 9 (locked
    # 2026-07-13): above risk_ai's 8, below sap.acm's 10 production spine.
    # Options ML bullets are deliberately NOT cited — MLE is out-of-lane.
    skill_weights:
      ai_llm:
        agentic_llm_systems: 9      # B-PROVA-01 — deployed multi-agent system, judge/orchestrator, retry logic
        llm_api_integration: 8      # B-PROVA-01 — server-side Anthropic API, structured/schema-validated outputs
        ai_evaluation_testing: 8    # B-PROVA-06 — AI regression suite, score-drift harness gating CI/CD
        prompt_engineering: 7       # B-PROVA-01 — multi-agent prompt design (SKILL-PROMPT-ENGINEERING)
        ai_security: 7              # B-PROVA-05 — prompt-injection defenses, LLM bias mitigation
      software:
        fullstack_typescript: 8     # B-PROVA-04, B-CAPTRACK-04 — production Next.js/TS/Supabase apps
        testing_ci_cd: 6            # B-PROVA-04/06 — GitHub Actions pipeline, Jest + Playwright suites
        api_integration: 6          # B-CAPTRACK-05 — real-time market-data/FX API integration
        auth_data_isolation: 6      # B-PROVA-04, B-CAPTRACK-04 — JWT auth, OAuth, Row Level Security
        domain_logic: 5             # B-CAPTRACK-01/02 — deterministic accounting engine, edge-case handling
        python_sql_fundamentals: 5  # B-TA-01 — Python/Java/SQL instruction (supporting)
    disqualifier:
      # PhD-required bundle (locked 2026-07-13): kills research-scientist
      # postings that leak in under engineer titles. "required"-only wording
      # avoids false-positiving on "PhD preferred" — same guard as risk_ai.
      # No CFA/FRM/stochastic-calculus phrases: those are risk_ai signals.
      max_years: 4
      phrases:
        - phd required
        - ph.d. required
        - doctorate required
        # Added 2026-07-14 (mined, zero >=65 hits): GPU-systems and AV
        # hiring pools that leak in under engineer titles.
        - autonomous vehicles
        - cuda
      # Title-level disqualifier (2026-07-14): research/DS titles and people-
      # management titles that leak in under engineer search terms. "intern"
      # deliberately NOT listed (an Intern AI Engineer row scored >=70).
      title_phrases:
        - scientist
        - manager
      reasoning_title: >-
        Auto-skipped: title matches an ai_eng title-disqualifier phrase
        (research/DS or people-management pool).
      scored_by: "rubric:ai-eng-jd-disqualifier"
      reasoning_phrase: >-
        Auto-skipped: JD contains an ai_eng disqualifier phrase (PhD/doctorate
        required, CUDA/GPU, or autonomous vehicles).
      reasoning_years: >-
        Auto-skipped: JD requires more years of experience than this vertical's
        max_years.


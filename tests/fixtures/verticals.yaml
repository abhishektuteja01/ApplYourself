out_of_lane:
  reasoning: >-
    Out-of-lane: title contains no in-lane keyword, so title_match=0 and the
    row cannot reach the fit>=50 shortlist.

# Title-classifier fallback for rows with no search term. First match wins.
# Order = ambiguity policy: SAP > Risk-AI > AI-eng > generic SAP catch-all
# (bare "Risk Analyst" -> sap). No match -> "".
classifier_rules:
  - vertical: sap
    pattern: '\b(?:sap|acm|s/?4(?:hana)?|etrm|ctrm|o2c|order to cash|sales and distribution|commodit\w*|signavio|mark[- ]to[- ]market|reconciliation|recon|erp)\b'
  - vertical: risk_ai
    pattern: '\b(?:model\s+risk|model\s+validation|model\s+development|validation|governance|grc|quant\w*|responsible\s+ai|trading\s+risk|financial\s+risk|market\s+risk|credit\s+risk|operational\s+risk|enterprise\s+risk|risk\s*(?:&|and)\s*compliance|ai\s+risk|ai\s+compliance|artificial\s+intelligence\s+(?:risk|governance|compliance))\b'
  - vertical: ai_eng
    pattern: "AI Engineer"
  - vertical: ai_eng
    pattern: "AI Software Engineer"
  # Families the "AI Engineer" literal misses: spelled-out "Artificial
  # Intelligence", the AI Application(s)/Developer/Agent titles. Ordered after
  # risk_ai, so governance/risk titles still land there first.
  - vertical: ai_eng
    pattern: "Artificial Intelligence"
  - vertical: ai_eng
    pattern: "AI Application"
  - vertical: ai_eng
    pattern: "AI Developer"
  - vertical: ai_eng
    pattern: "AI Agent"
  - vertical: ai_eng
    pattern: "\\bLLMs?\\b"
  - vertical: ai_eng
    pattern: "GenAI"
  - vertical: ai_eng
    pattern: "Generative AI"
  - vertical: ai_eng
    pattern: "Applied AI"
  - vertical: ai_eng
    pattern: "AI Agents"
  - vertical: ai_eng
    pattern: "AI Solution"
  - vertical: ai_eng
    pattern:
      match: "Forward Deployed"
      require_any: ["Engineer"]
  - vertical: ai_eng
    pattern:
      match: "ML Engineer"
      require_any:
        - "LLM"
        - "GenAI"
        - "Generative"
        - "NLP"
        - "Foundation Model"
  - vertical: ai_eng
    pattern:
      match: "Machine Learning"
      require_any:
        - "LLM"
        - "GenAI"
        - "Generative"
        - "NLP"
        - "Foundation Model"
  - vertical: ai_eng
    pattern:
      match: "Research Engineer"
      require_any:
        - "LLM"
        - "GenAI"
        - "Generative"
        - "NLP"
        - "Foundation Model"
  - vertical: sap
    pattern: '\b(?:functional|business analyst|systems? analyst|sox|risk|internal\s+controls|it\s+controls|risk[- &]+controls|trad\w*|surveillance|advisory|audit\w*|compliance)\b'

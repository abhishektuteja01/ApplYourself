# The location gate's behaviour, one case per line.
# loc: the location text. allow: the allowlist (below; default wide). lane: the
# vertical (an abroad country keeps only abroad_lanes). keep: the verdict.
# countries: the countries the text reads, where it matters. shown: the display form.
# was/why: the verdict before the minimal gate, and why it changed.
allowlists:
  us: [United States]
  us_in: [United States, India]
  wide: [United States, India, Germany, Ireland, Netherlands, Poland, Sweden, United Arab Emirates]
abroad: {india: [lane_a]}


# The location gate's behaviour, one case per line.
# loc: the location text. allow: the allowlist (below; default wide). lane: the
# vertical (an abroad country keeps only abroad_lanes). country: the source's own
# country codes. title: documents the case (the gate does not read titles).
# keep: the verdict. countries: the countries the verdict read, where it matters.
# shown: the display form. was/why: the libpostal parser's answer, and why it changed.
allowlists:
  us: [United States]
  us_in: [United States, India]
  wide: [United States, India, Germany, Ireland, Netherlands, Poland, Sweden, United Arab Emirates]
abroad: {india: [lane_a]}


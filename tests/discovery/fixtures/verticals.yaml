# Synthetic test fixture — three fictional verticals. Contains no real
# search terms, exclude lists, or skill weights.
#
# Mirrored byte-for-byte at tests/fixtures/verticals.yaml and
# tests/discovery/fixtures/verticals.yaml; TestFixtureMirrors enforces it.
# Shaped after profile/verticals.example.yaml and enriched so every schema
# branch is covered: include-gate on, strong-keep override, drop_phrases and
# years, regex + literal + compound classifier rules, and one vertical
# owning rules at two priorities.
#
# Real-config coverage lives in tests/test_real_config_drift.py, which runs
# only on a machine that has profile/verticals.yaml.

schema_version: 1
# Deliberately not the first vertical: nothing may assume default == names[0].
default_vertical: example_tertiary

verticals:
  example_primary:
    display_name: Widget Engineering
    resume_file: profile/verticals/example_primary/resume_example_primary.md
    # The lane's resume shape. Picks live on bullets (default_for) and
    # skills (show), so this block names no ids.
    resume:
      sections: [summary, work, projects, education, skills]
      bullets: [4, 6]
      skill_lines:
        - "Domain & Enterprise"
        - "Programming"
        - "AI & Machine Learning"
        - "Databases & Tools"
      summary: >-
        Widget operations analyst who reconciles plant output, configures assembly lines and builds Python and SQL tooling for sprocket compliance data.
    # No term contains "Engineer" — "engineer" is a title exclude term here.
    search_terms:
      - Widget Functional Consultant
      - Widget Platform Analyst
      - Widget Operations Analyst
      - Gizmo Systems Consultant
      - Gizmo Reconciliation Analyst
    linkedin_terms:
      - Widget Functional Consultant
      - Gizmo Systems Consultant
    title_include_terms:
      - widget
      - gizmo
      - doohickey
    title_exclude_terms:
      - senior
      - principal
      - lead
      - head of
      - clinical
      - nurse
      - rival doohickey
      - manager
      - director
      - architect
      - vice president
      - buyer
      - sourcing
      - procurement
      - engineer
    skill_weights:
      widgets:
        widget_assembly: 10
        gizmo_calibration: 7
      domain:
        widget_supply_chain: 9
    # Dropped before judging when the JD holds one (whole words).
    drop_phrases:
      - rival widget suite
      - legacy gizmo stack
      - widget payroll module
      - solution architect
    # Required years -> seniority cap; a JD asking more than the
    # largest key is dropped.
    years: {3: 14, 4: 10}

  example_secondary:
    display_name: Sprocket Compliance
    resume_file: profile/verticals/example_secondary/resume_example_secondary.md
    # The lane's resume shape. Picks live on bullets (default_for) and
    # skills (show), so this block names no ids.
    resume:
      sections: [summary, projects, work, education, skills]
      bullets: [4, 6]
      skill_lines:
        - "AI & Machine Learning"
        - "Programming"
        - "Databases & Tools"
        - "Domain & Enterprise"
      summary: >-
        Builds and tests validation and LLM tooling for sprocket compliance and cog maintenance, backed by two years of widget plant operations.
    search_terms:
      - Sprocket Risk
      - Sprocket Validation
      - Sprocket Governance
      - Sprocket Risk Management
      - Sprocket Compliance Analyst
      - Cog Governance Analyst
    linkedin_terms:
      - Sprocket Risk
      - Sprocket Governance
    title_include_terms:
      - sprocket
      - governance
      - compliance
      - quantitative sprocket
    title_exclude_terms:
      - software engineer
      - cog learning
      - quality
      - clinical
      - privacy
      - nurse
      - automation
      - operations
      - data analyst
      - developer
    title_strong_keep_terms:
      - sprocket risk management
    skill_weights:
      sprocket_risk:
        sprocket_validation: 9
        sprocket_governance: 8
      sprocket_quant:
        sprocket_backtesting: 6
    # Dropped before judging when the JD holds one (whole words).
    drop_phrases:
      - phd required
      - ph.d. required
      - doctorate required
      - sprocket charter required
      - sprocket certification required
      - legacy sprocket ledger
      - vendor sprocket risk
    # Required years -> seniority cap; a JD asking more than the
    # largest key is dropped.
    years: {3: 14, 4: 10}

  example_tertiary:
    display_name: Cog Engineering
    resume_file: profile/verticals/example_tertiary/resume_example_tertiary.md
    search_terms:
      - Cog Engineer
      - Applied Cog Engineer
      - Flywheel Cog Engineer
      - Cog Deployment Engineer
      - Cog Platform Engineer
    linkedin_terms:
      - Cog Engineer
      - Cog Deployment Engineer
    title_include_terms:
      - cog
      - flywheel
      - cog deployment
    title_exclude_terms:
      - senior
      - lead
      - distinguished
      - research scientist
      - cog learning
      - scientist
      - manager
    title_strong_keep_terms:
      - cog learning platform
      - cog learning agents
    skill_weights:
      cog_stack:
        cog_agents: 9
        cog_platform: 8
    # Dropped before judging when the JD holds one (whole words).
    drop_phrases:
      - phd required
      - ph.d. required
      - doctorate required
      - autonomous cogs
      - cog firmware
    # Required years -> seniority cap; a JD asking more than the
    # largest key is dropped.
    years: {3: 14, 4: 10}


# Ordered — first match wins. example_primary owns two rules: a strong signal
# above everything, and a generic catch-all below everything (ambiguity
# defaults to primary). Precedence: primary-strong > secondary > tertiary >
# primary-catch-all.
classifier_rules:
  - vertical: example_primary
    pattern: '\b(?:widget|gizmo|doohickey)\b'
  - vertical: example_secondary
    pattern: '\b(?:sprocket|governance|compliance|quant\w*|cog\s+(?:risk|governance|compliance))\b'
  - vertical: example_tertiary
    pattern: "Cog Engineer"
  - vertical: example_tertiary
    pattern: "Applied Cog"
  - vertical: example_tertiary
    pattern: "Flywheel Cog"
  - vertical: example_tertiary
    pattern: "Cog Agent"
  - vertical: example_tertiary
    pattern: "Cog Platform"
  - vertical: example_tertiary
    pattern:
      match: "Cog Deployment"
      require_any: ["Engineer"]
  # Compound: bare "Cog Learning Engineer" is out-of-lane by charter; only a
  # platform/agents qualifier pulls it into the lane.
  - vertical: example_tertiary
    pattern:
      match: "Cog Learning"
      require_any:
        - Platform
        - Agents
  - vertical: example_primary
    pattern: '\b(?:functional|business analyst|systems? analyst|operations|risk|audit\w*|reconciliation)\b'

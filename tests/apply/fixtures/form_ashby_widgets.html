<!--

  driver depends on. Synthetic ids and question text in the house style; the
  markup shape is what live boards render, including the CSS-module class
  hashes (which change on every Ashby deploy — hence the driver matching
  `_active_` by prefix rather than by the whole token).

  Captured states that a static scan cannot show: a combobox mid-open with its
  listbox floated to document level, and a yes/no toggle with "No" chosen.
-->
<html>
<body>
<div id="form" class="ashby-application-form-container">

           id="_systemfield_name" type="text" class="_input_80epu_28" value="">

  </div>

  <!-- An enumerated select. The API calls this kind `select`; above roughly a

  <div class="_fieldEntry_1e3gg_28 ashby-application-form-field-entry"
       data-field-path="00000010-0000-0000-0000-000000000010"
       data-field-entry-id="00000001-0000-0000-0000-000000000001_00000010-0000-0000-0000-000000000010">

  <div class="_fieldEntry_1e3gg_28 ashby-application-form-field-entry"

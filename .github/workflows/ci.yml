name: ci

# The pre-push hook needs `git config core.hooksPath .githooks`, which is local
# config and cannot be versioned, and `--no-verify` skips it anyway. This is the
# copy of the gate that neither can reach.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy
      - run: ./scripts/r7_scan.sh
      - run: uvx --from shellcheck-py==0.11.0.1 shellcheck --severity=warning scripts/*.sh scripts/stages/*.sh .githooks/* .claude/hooks/*.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      # Also proves the suite runs in a non-UTF-8 locale, which is how a bare
      # container and a cron job both run it.
      - run: uv run pytest tests -q
        env:
          LC_ALL: C
          LANG: C
          PYTHONUTF8: "0"

  pii-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The real denylist is gitignored and never reaches CI, so run the gate
      # the way a fresh clone does: with the shipped example. That keeps the
      # documented onboarding path honest, and still catches a tracked binary.
      - run: cp profile/pii_denylist.example.txt profile/pii_denylist.txt
      - run: ./scripts/pii_scan.sh
